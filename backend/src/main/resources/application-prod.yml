# DATABASE_URL (a postgresql:// connection string, as Neon provides it) is converted
# into these properties by DatabaseUrlEnvironmentPostProcessor when DB_URL is not set.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon scales to zero when no connections are open, so let idle connections close.
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 20000

app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    com.taleforge: INFO
    org.springframework.boot.web.embedded: INFO
