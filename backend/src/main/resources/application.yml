spring:
  application:
    name: taleforge
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json
  shutdown: graceful
  error:
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-this-must-be-32-bytes-or-more}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    org.hibernate.orm.deprecation: ERROR
